name: Supabase keep-alive (GYM UNAB)

on:
  schedule:
    - cron: "17 12 */3 * *"   # cada 3 días, 09:17 hora Chile aprox.
  workflow_dispatch:           # permite ejecutarlo a mano

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar la base
        run: |
          curl -sS -f -X POST \
            "https://cqvlenhilzpqtjdzmpip.supabase.co/rest/v1/rpc/socio_portal" \
            -H "apikey: ${{ secrets.SUPABASE_UNAB_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_UNAB_ANON_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"p_rut":"keepalive","p_pin":"0"}'
